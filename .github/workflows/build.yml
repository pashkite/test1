name: Build Android APK and Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Rust unit tests
        run: cargo test --lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android platform and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Compile Rust engine for Android arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release --lib
          test -s android/app/src/main/jniLibs/arm64-v8a/liblimbus_core.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK (signed by Android debug key)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK includes Rust and v0.4 package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_SDK_ROOT/build-tools/35.0.0/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep 'dev.ashkite.limbusauto.icons'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/liblimbus_core.so'
      - uses: actions/upload-artifact@v4
        with:
          name: LimbusAutoRust-android-icons-v0.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows Rust EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows EXE
        run: cargo build --release --bin limbus-windows
      - uses: actions/upload-artifact@v4
        with:
          name: LimbusAutoRust-windows-manual-v0.2
          path: target/release/limbus-windows.exe
          if-no-files-found: error
          retention-days: 30
