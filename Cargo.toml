[package]
name = "limbus-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "limbus_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "limbus-windows"
path = "src/bin/limbus-windows.rs"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(windows)'.dependencies]
screenshots = "0.8.10"
enigo = "0.2.1"
image = "0.24.9"
