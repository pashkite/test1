plugins { id 'com.android.application' }
android {
    namespace 'dev.ashkite.limbusauto'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.ashkite.limbusauto.icons'
        minSdk 30
        targetSdk 35
        versionCode 6
        versionName '0.4.0-icon-matcher'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
